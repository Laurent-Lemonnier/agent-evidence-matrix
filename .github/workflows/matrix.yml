name: matrix
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python build_matrix.py --check
      # The review gate (intake.yml) only holds if main requires it: refuse a run in which it is advisory.
      - name: Main requires the review gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 -I tools/required_checks.py
      # The daily run reports every pinned upstream whose default branch moved past its pin.
      - name: Upstream freshness (warnings only)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build_matrix.py --freshness | sed 's/^/::warning::/'
  # The pinned reader, installed from the hash-locked requirements, judges every record a
  # project says is RFC 8785 bytes. The run must equal the committed one, and a one-member
  # reorder of one record must turn exactly that line and the exit code (1, comparison failed).
  reader:
    runs-on: ubuntu-latest
    env:
      PROOFBUNDLE: 53d1eafe8eaf7c558ed394e01d1b29d132c2fd47
      AEP_SANDBOX: c5d4194f4a5fbd0a117d3ed9b4ca0bd164822132
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: Fetch the pinned upstreams
        run: |
          git clone -q https://github.com/b7n0de/proofbundle ../proofbundle
          git -C ../proofbundle checkout -q "$PROOFBUNDLE"
          git clone -q https://github.com/tyche-institute/aep-sandbox ../aep-sandbox
          git -C ../aep-sandbox checkout -q "$AEP_SANDBOX"
      - name: Replay and compare with the recorded run
        run: |
          python -I adapters/reader_cells.py proofbundle=../proofbundle aep-sandbox=../aep-sandbox > "$RUNNER_TEMP/body.txt"
          head -2 adapters/reader-run.txt | cat - "$RUNNER_TEMP/body.txt" | diff adapters/reader-run.txt -
      - name: A reordered record must change its line and exit 1
        run: |
          F=conformance/decision/crossimpl/schema-conformant/decision_receipt.jcs
          set +e
          python -I adapters/reader_cells.py --mutation "proofbundle/$F" proofbundle=../proofbundle > "$RUNNER_TEMP/mut.txt"
          rc=$?
          set -e
          test "$rc" = 1 || { echo "expected exit 1, got $rc"; cat "$RUNNER_TEMP/mut.txt"; exit 1; }
          grep -qxF "$(printf 'proofbundle/%s\tcontradicted\tcanonical_bytes_differ' "$F")" "$RUNNER_TEMP/mut.txt"
          test "$(grep -c contradicted "$RUNNER_TEMP/mut.txt")" = 1
      - name: A missing reader is a setup error, not a result
        run: |
          set +e
          PATH=/usr/bin:/bin python3 -I adapters/reader_cells.py proofbundle=../proofbundle > /dev/null 2>&1
          rc=$?
          set -e
          test "$rc" = 2
  # Rebuilds the ICON agentops example run with the project's own stdlib-only code at the pinned
  # commit and compares it with the committed run, then reads the committed records.
  icon-agentops:
    runs-on: ubuntu-latest
    env:
      ICON_COMMIT: 8d370de7e09d2fe5d9efa93120e564cd825331fc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: Fetch the pinned upstream
        run: |
          git clone -q https://github.com/billwuqin/Agent-Observability-Intervention-Control ../icon
          git -C ../icon checkout -q "$ICON_COMMIT"
      - name: The committed records equal the recorded run
        run: |
          python -I adapters/icon_agentops.py "../icon/Hackathon/IETF 127/running code/agentops" > "$RUNNER_TEMP/body.txt"
          head -1 adapters/icon-agentops-run.txt | cat - "$RUNNER_TEMP/body.txt" | diff adapters/icon-agentops-run.txt -
      # bash with pipefail, so a regenerated events, evidence or analysis file that differs (adapter exit 1)
      # fails the step; the adapter drops clock readings, including call-latency's copied duration.
      - name: Regenerate with their code and compare
        shell: bash
        run: |
          (cd "../icon/Hackathon/IETF 127/running code/agentops" && python3 -m agentops demo --out "$RUNNER_TEMP/ao-regen" > /dev/null)
          python -I adapters/icon_agentops.py "../icon/Hackathon/IETF 127/running code/agentops" --regenerated "$RUNNER_TEMP/ao-regen" | tee "$RUNNER_TEMP/regen.txt"
          head -1 adapters/icon-agentops-regen-run.txt | cat - "$RUNNER_TEMP/regen.txt" | diff adapters/icon-agentops-regen-run.txt -
  # Runs dns-aid-core's own publisher and signer at the pinned commit (their records), checks the
  # emitted SVCB records against both draft revisions and the signed bindings with our reader, and
  # requires every recorded run to replay line for line. Keys are fresh per run; verdicts are not.
  dnsaid:
    runs-on: ubuntu-latest
    env:
      DNSAID_COMMIT: 825ccea1259267898df59b80e063317ec6900224
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch the pinned upstream and the two draft revisions
        run: |
          git clone -q https://github.com/dns-aid/dns-aid-core ../dns-aid-core
          git -C ../dns-aid-core checkout -q "$DNSAID_COMMIT"
          pip install ../dns-aid-core
          mkdir ../drafts
          curl -sfo ../drafts/02.txt https://www.ietf.org/archive/id/draft-mozleywilliams-dnsop-dnsaid-02.txt
          curl -sfo ../drafts/00.txt https://www.ietf.org/archive/id/draft-mozleywilliams-dawn-dnsaid-00.txt
          echo "aab6b8bbd3aa45f24a29702cf96854328dab51ef37c851d73c81daf4b6ced494  ../drafts/02.txt" | sha256sum -c
          echo "8a77fc8d86415714a0f39506d09510ee20b966c244dd3230355ccd528a7fe2e6  ../drafts/00.txt" | sha256sum -c
      - name: Emission against each revision equals the recorded runs
        run: |
          for r in 02 00; do
            python -I adapters/dnsaid_adapter.py ../dns-aid-core "../drafts/$r.txt" | diff "adapters/dnsaid-run-$r.txt" -
          done
      - name: A descriptor byte flipped after hashing must fail the digest check
        run: python -I adapters/dnsaid_adapter.py ../dns-aid-core ../drafts/00.txt --tamper | grep -q "^DIFF  cap-sha256/their-verifier-accepts-served-bytes"
      - name: Signed bindings equal the recorded run
        run: |
          sh adapters/dnsaid_sig_run.sh python ../dns-aid-core "$RUNNER_TEMP/sig" > "$RUNNER_TEMP/sig.txt"
          head -1 adapters/dnsaid-sig-run.txt | cat - "$RUNNER_TEMP/sig.txt" | diff adapters/dnsaid-sig-run.txt -
  # Replays the EATF canonicalizer of the pinned release through the RFC 8785 corpus, recording which
  # code refused each vector; a crash exits 2 and fails the corpus run instead of scoring as a refusal.
  eatf-jcs:
    runs-on: ubuntu-latest
    env:
      EATF_COMMIT: fade5e0ac1223b7ff13339b7c9bcf973b699f9a7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch the pinned release and install its library
        run: |
          git clone -q https://github.com/tyche-institute/eatf-verifier ../eatf
          git -C ../eatf checkout -q "$EATF_COMMIT"
          pip install ../eatf/lib-python agent-evidence-vectors==0.36.3
      - name: Corpus run equals the recorded run
        run: |
          set +e
          A2A_JCS_TARGET=rfc8785 EATF_LIB_PYTHON=../eatf/lib-python EATF_CLASS_LOG="$RUNNER_TEMP/classes.log" \
            agent-evidence-vectors --corpus vectors-a2a-jcs-v01 --verifier "python adapters/eatf_jcs_cli.py" > "$RUNNER_TEMP/run.txt" 2>&1
          set -e
          { head -1 adapters/eatf-jcs-run.txt; grep -v "^a2a-agent-card" "$RUNNER_TEMP/run.txt"; grep "^a2a-agent-card" "$RUNNER_TEMP/run.txt" | sed 's/; report .*//'; echo "# refusal path per vector (EATF_CLASS_LOG), sorted"; sort "$RUNNER_TEMP/classes.log"; } | diff adapters/eatf-jcs-run.txt -
  # Reads the IETF 127 pack's signed ARD entries with our own verifier (draft-bu-dawn-ard-discovery-00 section 3.5)
  # and requires the recorded outcomes line for line; the three examples are controls that must verify.
  aep-ard-cell2:
    runs-on: ubuntu-latest
    env:
      SANDBOX_COMMIT: c5d4194f4a5fbd0a117d3ed9b4ca0bd164822132
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: Fetch the pinned pack
        run: |
          git clone -q https://github.com/tyche-institute/aep-sandbox ../sandbox
          git -C ../sandbox checkout -q "$SANDBOX_COMMIT"
      - name: Outcomes equal the recorded run
        shell: bash
        run: |
          python -I adapters/aep_ard_cell2.py ../sandbox/hackathon/ietf127/ard > "$RUNNER_TEMP/run.txt"
          head -1 adapters/aep-ard-cell2-run.txt | cat - "$RUNNER_TEMP/run.txt" | diff adapters/aep-ard-cell2-run.txt -
      - name: The recorded run is the one sealed before the answer key
        run: python -I tools/seal.py verify records/aep-ard-cell2-seal --check-files
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The readers under test run on the hash-locked requirements, the same bytes the reader job installs.
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install pytest==8.3.5
      - run: python -m pytest -q tests
  canonicalizers:
    # Rows 26 and 27: each project's canonicalization function, read from its pinned commit, scored again on the pinned
    # corpus and probed with the four parse-layer inputs; the output must equal the committed run line for line.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
      - name: Fetch the corpus and the pinned upstreams
        run: |
          git clone -q --filter=blob:none https://github.com/probityai/agent-evidence-vectors ../aev && git -C ../aev checkout -q 13247ea551e470fb57413fdfab4f2738147613a1
          git clone -q --filter=blob:none https://github.com/a2aproject/a2a-js ../a2a-js && git -C ../a2a-js checkout -q 3f5cb54fa94f81e3d1ff58f852c53fcb7135934c
          git clone -q --filter=blob:none https://github.com/x402-foundation/x402 ../x402 && git -C ../x402 checkout -q b38d3becc5a05234008506a42f62c3b2186510ce
      - name: Each run equals its recorded run
        run: |
          S="node --no-warnings=ExperimentalWarning adapters/jcs_function_score.mjs"
          C=../aev/corpora/vectors-a2a-jcs-v01
          $S --source ../a2a-js/src/signature.ts --entry jcsStringify --decl MAX_CANONICALIZATION_DEPTH --decl CanonicalizationError --decl isContainer --decl assertNestingDepth $C > a2a.txt
          diff adapters/a2a-js-jcs-run.txt a2a.txt
          $S --source ../x402/typescript/packages/extensions/src/offer-receipt/signing.ts --entry canonicalize --decl serializeValue --decl serializeNumber --decl serializeString --decl serializeArray --decl serializeObject $C > x402.txt
          diff adapters/x402-jcs-run.txt x402.txt
      - name: Each control edit must flip exactly the cases it fixes
        # Lone-surrogate refusal alone flips the five lone-surrogate cases and leaves the three non-finite cases failing,
        # which proves those three reach the function as the numbers they name rather than being refused by the harness
        # parse; adding the non-finite refusal flips them too. The duplicate probes stay accepted: the function takes a
        # parsed value.
        run: |
          D=(--decl MAX_CANONICALIZATION_DEPTH --decl CanonicalizationError --decl isContainer --decl assertNestingDepth)
          sed -e 's/^  assertNestingDepth(value, depth);$/  assertNestingDepth(value, depth); if (typeof value === "string" \&\& !value.isWellFormed()) throw new Error("lone surrogate");/' \
              -e 's/^  const keys = Object.keys(record).sort();$/  const keys = Object.keys(record).sort(); for (const k of keys) if (!k.isWellFormed()) throw new Error("lone surrogate");/' \
              ../a2a-js/src/signature.ts > surrogates.ts
          sed -e 's/^    return JSON.stringify(value);$/    if (typeof value === "number" \&\& !Number.isFinite(value)) throw new Error("non-finite"); return JSON.stringify(value);/' \
              surrogates.ts > fixed.ts
          if cmp -s surrogates.ts ../a2a-js/src/signature.ts || cmp -s fixed.ts surrogates.ts; then echo "::error::a control edit did not apply"; exit 1; fi
          node --no-warnings=ExperimentalWarning adapters/jcs_function_score.mjs --source surrogates.ts --entry jcsStringify "${D[@]}" ../aev/corpora/vectors-a2a-jcs-v01 > surrogates.txt
          grep -q "^scored=53 pass=50 fail=3 " surrogates.txt || { cat surrogates.txt; exit 1; }
          [ "$(grep -c '^FAIL A5-REJECT-01[678] MUST-REJECT got=7b226e223a6e756c6c7d$' surrogates.txt)" = 3 ] || { cat surrogates.txt; exit 1; }
          node --no-warnings=ExperimentalWarning adapters/jcs_function_score.mjs --source fixed.ts --entry jcsStringify "${D[@]}" ../aev/corpora/vectors-a2a-jcs-v01 > fixed.txt
          grep -q "^scored=53 pass=53 fail=0 " fixed.txt || { cat fixed.txt; exit 1; }
          grep -q "^PROBE duplicate-member input=7b2261223a312c2261223a327d accepted " fixed.txt || { cat fixed.txt; exit 1; }
  corpus-jcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The Action runs its own Python, so the canonicalizer is installed beside the adapter and found through PYTHONPATH.
      - run: pip install --target vendor rfc8785==0.1.4
      - uses: probityai/agent-evidence-vectors@v0.36.3
        env:
          A2A_JCS_TARGET: rfc8785
          PYTHONPATH: ${{ github.workspace }}/vendor
        with:
          corpus: vectors-a2a-jcs-v01
          verifier: python adapters/rfc8785_cli.py
  # Rebuilds the AIREP run record from the pinned upstream commit, in AIREP's own
  # hash-locked environment, and fails when the replay differs from adapters/airep-run.txt.
  # It runs on every pull request so the recorded cells cannot drift from what the adapter computes.
  airep-replay:
    runs-on: ubuntu-latest
    env:
      AIREP_COMMIT: 3d62af2a3c217939a3556b741550c2563430322f
    steps:
      - uses: actions/checkout@v7
      # The recorded run names Python 3.12.3, and the runner image no longer ships it, so uv
      # installs that exact interpreter for AIREP's environment.
      - uses: astral-sh/setup-uv@v7
      - name: Fetch AIREP at the pinned commit
        run: |
          git clone -q https://github.com/halvrenofviryel/ai-runtime-evidence-protocol ../ai-runtime-evidence-protocol
          git -C ../ai-runtime-evidence-protocol checkout -q "$AIREP_COMMIT"
          test "$(git -C ../ai-runtime-evidence-protocol rev-parse HEAD)" = "$AIREP_COMMIT"
      - name: Build AIREP's offline environment
        run: |
          D=../ai-runtime-evidence-protocol/spec/airep/v0.2/class-verification/offline-python-deps
          uv venv --seed --python 3.12.3 ../airep-venv
          ../airep-venv/bin/python -m pip install --no-index --require-hashes --find-links "$D/wheels" -r "$D/requirements.lock"
      - name: Replay and compare with the recorded run
        run: |
          ../airep-venv/bin/python -B adapters/airep_adapter.py ../ai-runtime-evidence-protocol > "$RUNNER_TEMP/airep-run.txt"
          diff adapters/airep-run.txt "$RUNNER_TEMP/airep-run.txt"
      # A mutation that only trips the clean-checkout gate or the JSON parser exits 2 and
      # proves nothing about the comparison. This one changes one hex digit of a signed
      # field, so the artifact's tagged hash no longer verifies, and requires exit 1
      # (regression evidence differed) with the named cell turning contradicted.
      - name: A semantic mutation must change the verdict, not trip a setup gate
        run: |
          F=examples/v02/fixtures/complete.json
          python3 -I - "../ai-runtime-evidence-protocol/$F" <<'PY'
          import sys
          p = sys.argv[1]
          t = open(p, encoding="utf-8").read()
          k = '"authorized_action_digest": "sha256:'
          i = t.index(k) + len(k)
          t = t[:i] + ("0" if t[i] != "0" else "1") + t[i + 1:]
          open(p, "w", encoding="utf-8").write(t)
          PY
          set +e
          ../airep-venv/bin/python -B adapters/airep_adapter.py --mutation "$F" ../ai-runtime-evidence-protocol > "$RUNNER_TEMP/airep-mut.txt" 2>&1
          rc=$?
          set -e
          if [ "$rc" != 1 ]; then echo "expected exit 1 (comparison failed), got $rc"; cat "$RUNNER_TEMP/airep-mut.txt"; exit 1; fi
          grep -q '^lifecycle/complete contradicted' "$RUNNER_TEMP/airep-mut.txt"
      - name: The setup gate still refuses an unlisted modification
        run: |
          echo x >> ../ai-runtime-evidence-protocol/README.md
          set +e
          ../airep-venv/bin/python -B adapters/airep_adapter.py --mutation examples/v02/fixtures/complete.json ../ai-runtime-evidence-protocol > /dev/null 2>&1
          rc=$?
          set -e
          test "$rc" = 2
      # The signature sits outside the tagged-hash preimage, so admission and toctou still hold and
      # only record_authentication of the Execution fails. An adapter that reads toctou alone as
      # "authorized = executed" prints agrees here.
      - name: An unauthenticated Execution must not read as authorized = executed
        run: |
          git -C ../ai-runtime-evidence-protocol checkout -q -- .
          F=examples/v02/fixtures/complete.json
          python3 -I - "../ai-runtime-evidence-protocol/$F" <<'PY'
          import json, sys
          p = sys.argv[1]
          a = json.load(open(p, encoding="utf-8"))
          s = next(x for x in a if x["artifact_type"] == "execution")["integrity"]["signature"]
          s["value"] = ("1" if s["value"][0] != "1" else "2") + s["value"][1:]
          open(p, "w", encoding="utf-8").write(json.dumps(a, indent=2) + "\n")
          PY
          set +e
          ../airep-venv/bin/python -B adapters/airep_adapter.py --mutation "$F" ../ai-runtime-evidence-protocol > "$RUNNER_TEMP/airep-mut3.txt" 2>&1
          rc=$?
          set -e
          if [ "$rc" != 1 ]; then echo "expected exit 1, got $rc"; cat "$RUNNER_TEMP/airep-mut3.txt"; exit 1; fi
          grep -q '^lifecycle/complete contradicted' "$RUNNER_TEMP/airep-mut3.txt"
          grep -q '^authorized-vs-executed/complete contradicted' "$RUNNER_TEMP/airep-mut3.txt"
      # A byte-identical second copy of one Control drops both copies from the toctou group, which then
      # still reads SATISFIED; equality over a group with a duplicated record id is not agreement.
      - name: A duplicated record id must not read as authorized = executed
        run: |
          git -C ../ai-runtime-evidence-protocol checkout -q -- .
          F=examples/v02/fixtures/complete.json
          python3 -I - "../ai-runtime-evidence-protocol/$F" <<'PY'
          import json, sys
          p = sys.argv[1]
          a = json.load(open(p, encoding="utf-8"))
          a.append(dict(next(x for x in a if x["record_id"] == "demo.receipt")))
          open(p, "w", encoding="utf-8").write(json.dumps(a, indent=2) + "\n")
          PY
          set +e
          ../airep-venv/bin/python -B adapters/airep_adapter.py --mutation "$F" ../ai-runtime-evidence-protocol > "$RUNNER_TEMP/airep-mut4.txt" 2>&1
          rc=$?
          set -e
          if [ "$rc" != 1 ]; then echo "expected exit 1, got $rc"; cat "$RUNNER_TEMP/airep-mut4.txt"; exit 1; fi
          grep -q '^lifecycle/complete contradicted' "$RUNNER_TEMP/airep-mut4.txt"
          grep -q '^authorized-vs-executed/complete cannot-tell' "$RUNNER_TEMP/airep-mut4.txt"
  # Replays the cells on the Decision Provenance project's own records (row 4, cells E to H): the project's
  # verifiers at the pinned commits, run from copies with python -I, must print the committed run.
  lemonnier-own-records:
    runs-on: ubuntu-latest
    env:
      LEMONNIER_COMMIT: 615c0e07039fab5503feed330bf3ff4f1f5ef68e
      DPS_STANDARD_COMMIT: 007f8c99ec910564bac1c508b76c8ce8391fa11e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install cbor2==6.3.0 cryptography==50.0.2 jsonschema==4.26.0 asn1crypto==1.5.1
      - name: Fetch the pinned upstreams
        run: |
          git clone -q https://github.com/Laurent-Lemonnier/dps-scitt-decision-layer ../dps-scitt-decision-layer
          git -C ../dps-scitt-decision-layer checkout -q "$LEMONNIER_COMMIT"
          git clone -q https://github.com/decision-provenance-standard/standard ../dps-standard
          git -C ../dps-standard checkout -q "$DPS_STANDARD_COMMIT"
          test "$(cat ../dps-scitt-decision-layer/interop/aqta/approval-record/DPS_STANDARD_COMMIT)" = "$DPS_STANDARD_COMMIT"
      - name: Replay and compare with the recorded run
        run: python -I adapters/lemonnier_own_records_adapter.py ../dps-scitt-decision-layer ../dps-standard | diff adapters/lemonnier-own-records-run.txt -
  # Replays the Proofable authority-at-dispatch packet (row 25): the packet's own offline verifier on its 15
  # envelopes and one tampered copy per envelope, then the pinned reader of the contract on its 8 case records.
  proofable:
    runs-on: ubuntu-latest
    env:
      PROOFABLE_COMMIT: 513cd308c9f943e5cb4b096912806ad6fa3146e8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: Fetch the pinned packet and its verifier's dependency
        run: |
          git clone -q https://github.com/proofable/docs ../proofable-docs
          git -C ../proofable-docs checkout -q "$PROOFABLE_COMMIT"
          (cd ../proofable-docs/public/evidence/aaif/authority-at-dispatch/2026-11-02-suite && npm install --no-save @proofable/sdk@0.1.11)
      - name: The packet's verifier run equals the recorded run
        run: python -I adapters/proofable_aad_adapter.py ../proofable-docs | diff adapters/proofable-aad-run.txt -
      - name: The pinned reader's answer on the packet's records equals the recorded run
        run: python -I adapters/proofable_reader_cell.py ../proofable-docs | diff adapters/proofable-reader-cell-run.txt -
  # Row 28: Konrad Gruszka's two verifiers (retained source, run by his own runner) on the pinned
  # agent-evidence-vectors corpora, then the audit-record verifier through the external-verifier contract of
  # the open pull request 575. Each run must equal the committed one; one changed signature character must
  # turn his verdict from valid to malformed (exit 1, comparison failed as it must).
  b7n0de-verifiers:
    runs-on: ubuntu-latest
    env:
      VECTORS_COMMIT: 250de75575a945d00211415d7af41894d15427fa
      PR575_COMMIT: 34704695b763814f2f56d7926939131553465208
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: Fetch the pinned corpora and the contract runner
        run: |
          git clone -q --bare https://github.com/probityai/agent-evidence-vectors "$RUNNER_TEMP/aev.git"
          git -C "$RUNNER_TEMP/aev.git" cat-file -e "$VECTORS_COMMIT^{commit}"
          git -C "$RUNNER_TEMP/aev.git" fetch -q origin "$PR575_COMMIT"
          git -C "$RUNNER_TEMP/aev.git" worktree add -q "$RUNNER_TEMP/pr575" "$PR575_COMMIT"
      - name: His runner's verdicts on the corpus members equal the recorded run
        run: python -I adapters/b7n0de_verifiers_adapter.py records/b7n0de-verifiers "$RUNNER_TEMP/aev.git" | diff <(tail -n +3 adapters/b7n0de-verifiers-run.txt) -
      - name: One changed signature character turns his verdict
        run: |
          rc=0
          python -I adapters/b7n0de_verifiers_adapter.py records/b7n0de-verifiers "$RUNNER_TEMP/aev.git" --mutation > "$RUNNER_TEMP/mut.txt" || rc=$?
          test "$rc" = 1
          diff <(tail -n +3 adapters/b7n0de-verifiers-mutation-run.txt) "$RUNNER_TEMP/mut.txt"
      # No -I on the runner: it takes the agent_evidence_vectors of its own checkout from the script directory,
      # which -I would drop in favour of the pinned release in site-packages (that release lacks the PR 575 modules).
      - name: The contract run equals the recorded run
        run: |
          rc=0
          (cd records/b7n0de-verifiers && python "$RUNNER_TEMP/pr575/packaging/run_vectors.py" --vectors "$RUNNER_TEMP/pr575/corpora/vectors-agent-audit-record" --verifier "python -I contract-adapter/contract_adapter.py audit-record/agent_evidence_01/tools" --report "$RUNNER_TEMP/contract-report.json") > "$RUNNER_TEMP/contract.txt" || rc=$?
          test "$rc" = 1
          # the runner echoes the verifier command; the recorded run was made from a venv
          diff <(tail -n +5 adapters/b7n0de-contract-run.txt) <(sed 's#^\(agent-audit-record-conformance: \)python #\1venv/bin/python #' "$RUNNER_TEMP/contract.txt")
